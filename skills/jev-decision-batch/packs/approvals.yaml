name: approvals
version: '1'
extractor: python3 label_approvals.py
artifact: approvals-labels.jsonl
questions:
  risk_tier:
    type: choice
    instructions: From the assistant proposal that preceded the user's decision, what
      risk tier best describes the action being authorized? Judge the action's blast
      radius, not the reply's tone.
    criteria:
      trivial: Read-only or cosmetic work; no state change worth protecting.
      low: Local file edits or analysis; easily reversible by git/undo.
      medium: Multi-file changes, new artifacts, or writes outside the repo; recoverable
        with effort.
      high: Touches shared state, external services, messages, installs, or many files
        at once.
      destructive: Deletes data, rewrites history, sends external comms, or irreversible
        actions.
  gate_warranted:
    type: noul
    instructions: Was requiring human confirmation here the right call — i.e., would
      auto-proceeding without a gate have been unsafe?
    criteria:
      'true': A gate was justified by the action's risk.
      'false': The action was safe enough to auto-proceed.
decision:
  kind: sift
