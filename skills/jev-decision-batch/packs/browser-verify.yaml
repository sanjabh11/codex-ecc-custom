name: browser-verify
version: '1'
artifact: browser-verify.jsonl
description: >-
  Verdict pack for rendered-artifact verification — JEV judges whether a
  browser-captured page/artifact actually rendered and behaves as expected,
  from an accessibility-tree snapshot or screenshot description plus the
  stated expectation. Code bands pass/review/fail; JEV only answers.
questions:
  render_health:
    type: score
    instructions: >-
      Rate how well the captured evidence (snapshot text, screenshot
      description, console state) shows the page/artifact rendered and
      met the stated expectation — weight real content present against
      blanks, error pages, or perpetual loaders.
    criteria:
      - Nothing rendered; crash, error page, or blank.
      - Skeleton/spinner only; no real content.
      - Content rendered but partially broken or expectation unmet.
      - Renders correctly; minor cosmetic issues at most.
      - Fully renders and matches the stated expectation.
  defect_class:
    type: choice
    instructions: >-
      Which single defect class best describes what the evidence shows?
      Judge the dominant visible problem; 'none' when it renders and
      matches the expectation.
    criteria:
      none: Renders correctly and matches the stated expectation.
      layout-broken: Content present but visually broken — overlap,
        clipped, unreadable, or collapsed layout.
      wrong-content: Renders but shows wrong/missing data, placeholder
        text, or obviously unintended content.
      empty-state: Page rendered but the target content area is empty.
      crashed: Error page, JS crash, or nothing rendered at all.
      expectation-unmet: Renders fine but fails the stated expectation
        (missing element, wrong state, wrong interaction result).
      insufficient-evidence: Capture too thin to judge.
  is_broken:
    type: noul
    instructions: >-
      Is the artifact definitively broken — crashed, empty, error state,
      or fails the stated expectation outright (not a judgment call)?
    criteria:
      'true': Definitively broken or expectation failed.
      'false': Renders acceptably or issues are cosmetic/debatable.
  state_sufficient:
    type: noul
    instructions: >-
      Does the supplied evidence (snapshot/description + expectation)
      contain enough signal to judge without guessing?
    criteria:
      'true': Enough signal to judge.
      'false': Too thin; judgment would be a guess.
decision:
  kind: verdict
verdict:
  weights:
    render_health: 3
  max_level: 4
  bands:
    pass: 60
    review: 25
    fail: 0
  band_order: [fail, review, pass]
  veto_nouls:
    is_broken: 0.8
  veto_band: fail
  clarity_question: state_sufficient
  clarity_floor: 0.4
